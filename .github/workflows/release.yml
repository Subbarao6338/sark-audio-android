name: Release APK

on:
  push:
    branches:
      - main
      - stable
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '27'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Generate build keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/release.keystore \
            -alias androidreleasekey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Sark Audio,O=Sark,C=US"

      - name: Grant execute permissions for gradlew
        run: chmod +x gradlew

      - name: Determine Dynamic Version and Release Notes
        id: release_meta
        run: |
          VERSION_CODE="${GITHUB_RUN_NUMBER:-1}"
          MAJOR=0
          MINOR=$(( VERSION_CODE / 10 ))
          PATCH=$(( VERSION_CODE % 10 ))
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          TAG_NAME="v${VERSION_NAME}"

          # Find previous tag (if any) before current HEAD
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG_NAME" ]; then
            COMMITS_SUMMARY=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" 2>/dev/null || echo "")
            RELEASE_TITLE="Release v${VERSION_NAME} (since ${PREV_TAG})"
          else
            COMMITS_SUMMARY=""
            RELEASE_TITLE="Release v${VERSION_NAME}"
          fi

          if [ -z "$COMMITS_SUMMARY" ]; then
            COMMITS_SUMMARY=$(git log -n 5 --pretty=format:"- %s (%h)" 2>/dev/null || echo "- Automated release build (v${VERSION_NAME})")
          fi

          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

          # Write dynamic release notes to temporary markdown file for gh release
          {
            echo "### Sark Audio Release v${VERSION_NAME}"
            echo ""
            echo "#### What's Changed"
            echo "$COMMITS_SUMMARY"
            echo ""
            echo "#### Build Specifications"
            echo "- **Version**: \`v${VERSION_NAME}\` (Code \`${VERSION_CODE}\`)"
            echo "- **Architecture**: \`arm64-v8a\` strictly filtered native libraries."
            echo "- **Minification**: Aggressive R8/ProGuard dead code removal and resource shrinking enabled."
            echo "- **Design System**: Material 3 Expressive theme with dynamic color tokens."
            echo ""
            echo "#### Downloads"
            echo "- \`sark-audio-v${VERSION_NAME}-arm64.apk\`"
          } > release_body.md

      - name: Build Single arm64-v8a Release APK
        run: ./gradlew assembleRelease -PversionCode=${{ steps.release_meta.outputs.version_code }} -PversionName=${{ steps.release_meta.outputs.version_name }} -x lint -x testDebugUnitTest --no-daemon

      - name: Prepare Release Artifacts
        id: prepare_apk
        run: |
          APK_DIR="app/build/outputs/apk/release"
          VERSION="${{ steps.release_meta.outputs.version_name }}"
          OUTPUT_APK="sark-audio-v${VERSION}-arm64.apk"
          cp "${APK_DIR}/app-release.apk" "${OUTPUT_APK}"
          echo "apk_path=${OUTPUT_APK}" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sark-audio-arm64-release
          path: ${{ steps.prepare_apk.outputs.apk_path }}
          retention-days: 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          body_path: release_body.md
          draft: false
          prerelease: false
          files: ${{ steps.prepare_apk.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
